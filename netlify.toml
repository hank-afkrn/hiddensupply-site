# ── Edge Functions ────────────────────────────────────────────────────────────
[[edge_functions]]
  path    = "/joetime"
  function = "joetime-gate"

[[edge_functions]]
  path    = "/joetime/*"
  function = "joetime-gate"

# ── Cache headers ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
