# ── Build config ────────────────────────────────────────────────────────────
[build]
  publish = "."
  ignore  = "api/"

# ── Edge Functions ────────────────────────────────────────────────────────────
[[edge_functions]]
  path    = "/joetime/api/*"
  function = "nfs-api-proxy"

[[edge_functions]]
  path    = "/joetime"
  function = "joetime-gate"

[[edge_functions]]
  path    = "/joetime/*"
  function = "joetime-gate"

# ── Cache headers ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Affiliate network proxy ───────────────────────────────────────────────────
[[redirects]]
  from   = "/affiliate"
  to     = "https://kyuyrxaj.gensparkclaw.com/affiliate"
  status = 200
  force  = true

[[redirects]]
  from   = "/affiliate/*"
  to     = "https://kyuyrxaj.gensparkclaw.com/affiliate/:splat"
  status = 200
  force  = true
